<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Festivals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Upcoming Festivals</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div th:each="festival : ${festivals}" class="col">
            <div class="card h-100">
                <img th:if="${festival.imageUrl}" th:src="${festival.imageUrl}" class="card-img-top" alt="Festival image">
                <div class="card-body">
                    <h5 class="card-title" th:text="${festival.name}">Festival Name</h5>
                    <p class="card-text" th:text="${festival.description}">Description</p>
                    <p class="card-text">
                        <small class="text-muted">
                            <span th:text="${#temporals.format(festival.startDate, 'dd-MM-yyyy')}">Start Date</span>
                            to
                            <span th:text="${#temporals.format(festival.endDate, 'dd-MM-yyyy')}">End Date</span>
                        </small>
                    </p>
                    <a th:href="@{/festivals/{id}(id=${festival.id})}" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
