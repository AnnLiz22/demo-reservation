<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reservation Details</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/reservations}">Reservations</a></li>
            <li class="breadcrumb-item active">Details</li>
        </ol>
    </nav>

    <div class="card">
        <div class="card-header">
            <h1 class="h3 mb-0">Reservation Details</h1>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>ID:</strong> <span th:text="${reservation.id}"></span></p>
                    <p><strong>User ID:</strong> <span th:text="${reservation.userId}"></span></p>
                    <p><strong>Accommodation ID:</strong> <span th:text="${reservation.accommodationId}"></span></p>
                    <p><strong>Check-in Date:</strong> <span th:text="${#temporals.format(reservation.reservationStart, 'MM/dd/yyyy')}"></span></p>
                    <p><strong>Check-out Date:</strong> <span th:text="${#temporals.format(reservation.reservation_end, 'MM/dd/yyyy')}"></span></p>
                    <p>
                        <strong>Status:</strong>
                        <span th:text="${reservation.status}"
                              th:class="${'badge ' +
                                  (reservation.status == 'CONFIRMED' ? 'bg-success' : '') +
                                  (reservation.status == 'PENDING' ? 'bg-warning' : '') +
                                  (reservation.status == 'CANCELLED' ? 'bg-danger' : '')}">
                            </span>
                    </p>
                </div>
            </div>

            <div class="mt-4">
                <a th:href="@{/reservations}" class="btn btn-secondary">Back to List</a>
                <form th:action="@{/reservations/{id}(id=${reservation.id})}"
                      method="post"
                      style="display: inline;">
                    <input type="hidden" name="_method" value="DELETE">
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('Are you sure you want to delete this reservation?')">
                        Delete Reservation
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
