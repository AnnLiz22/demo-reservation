<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Accommodation Reservations</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Accommodation Reservations</h1>

    <!-- Create New Reservation Form -->
    <div class="card mb-4">
        <div class="card-header">
            <h2 class="h5 mb-0">Create New Reservation</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/reservations}" method="post">
                <div class="mb-3">
                    <label for="userId" class="form-label">User ID</label>
                    <input type="number" class="form-control" id="userId" name="userId" required>
                </div>
                <div class="mb-3">
                    <label for="accommodationId" class="form-label">Accommodation ID</label>
                    <input type="number" class="form-control" id="accommodationId" name="accommodationId" required>
                </div>
                <div class="mb-3">
                    <label for="reservationStart" class="form-label">Check-in Date</label>
                    <input type="date" class="form-control" id="reservationStart" name="reservationStart" required>
                </div>
                <div class="mb-3">
                    <label for="reservation_end" class="form-label">Check-out Date</label>
                    <input type="date" class="form-control" id="reservation_end" name="reservation_end" required>
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-control" id="status" name="status" required>
                        <option value="PENDING">Pending</option>
                        <option value="CONFIRMED">Confirmed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Create Reservation</button>
            </form>
        </div>
    </div>

    <!-- Reservations List -->
    <div class="card">
        <div class="card-header">
            <h2 class="h5 mb-0">Current Reservations</h2>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(reservations)}" class="alert alert-info">
                No reservations found.
            </div>
            <div th:if="${not #lists.isEmpty(reservations)}" class="table-responsive">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>User ID</th>
                        <th>Accommodation ID</th>
                        <th>Check-in Date</th>
                        <th>Check-out Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="reservation : ${reservations}">
                        <td th:text="${reservation.id}"></td>
                        <td th:text="${reservation.userId}"></td>
                        <td th:text="${reservation.accommodationId}"></td>
                        <td th:text="${#temporals.format(reservation.reservationStart, 'MM/dd/yyyy')}"></td>
                        <td th:text="${#temporals.format(reservation.reservation_end, 'MM/dd/yyyy')}"></td>
                        <td>
                                    <span th:text="${reservation.status}"
                                          th:class="${'badge ' +
                                          (reservation.status == 'CONFIRMED' ? 'bg-success' : '') +
                                          (reservation.status == 'PENDING' ? 'bg-warning' : '') +
                                          (reservation.status == 'CANCELLED' ? 'bg-danger' : '')}">
                                    </span>
                        </td>
                        <td>
                            <a th:href="@{/reservations/{id}(id=${reservation.id})}" class="btn btn-sm btn-info">View</a>
                            <form th:action="@{/reservations/{id}(id=${reservation.id})}"
                                  method="post"
                                  style="display: inline;">
                                <input type="hidden" name="_method" value="DELETE">
                                <button type="submit" class="btn btn-sm btn-danger"
                                        onclick="return confirm('Are you sure you want to delete this reservation?')">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
