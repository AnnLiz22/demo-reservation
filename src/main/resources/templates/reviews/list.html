<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Festivals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Reviews</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div th:each="review : ${reviews}" class="col">
            <div class="card h-100">
                <img th:if="${review.imageUrl}" th:src="${review.imageUrl}" class="card-img-top" alt="Review image">
                <div class="card-body">

                    <h5 class="card-title" th:text="${review.rating}">Review rating</h5>
                    <p class="card-text" th:text="${review.comment}">Your comment</p>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
